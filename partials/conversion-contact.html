<!-- Contact -->

      <section class="section section-contact" id="contact">

        <div class="container">

          <header class="contact-header">

            <span class="contact-eyebrow">contact</span>

            <h2 class="contact-title">Parlons des besoins de vos collaborateurs</h2>

          </header>

          <div class="contact-layout">

            <aside class="contact-info">

              <p class="contact-info__lead">Paris &amp; Lyon consultants à votre écoute du lundi au vendredi.</p>

              <div class="contact-offices">

                <a class="contact-office" href="tel:0820001030">

                  <span class="contact-office__icon" aria-hidden="true">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

                      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />

                    </svg>

                  </span>

                  <span class="contact-office__body">

                    <span class="contact-office__city">Paris</span>

                    <span class="contact-office__value">08 20 00 10 30</span>

                  </span>

                </a>

                <a class="contact-office" href="tel:0451085102">

                  <span class="contact-office__icon" aria-hidden="true">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

                      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />

                    </svg>

                  </span>

                  <span class="contact-office__body">

                    <span class="contact-office__city">Lyon</span>

                    <span class="contact-office__value">04 51 08 51 02</span>

                  </span>

                </a>

              </div>

              <p class="contact-info__note">
                0820 00 10 30 * (0,095&nbsp;€ HT/min)<br />
                Du lundi au jeudi de 9h à 18h<br />
                et le vendredi de 9h à 17h
              </p>

              <a class="contact-email" href="mailto:contact@justeatemps.com">

                <span class="contact-email__icon" aria-hidden="true">

                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

                    <rect x="2" y="4" width="20" height="16" rx="2" />

                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />

                  </svg>

                </span>

                contact@justeatemps.com

              </a>

            </aside>

            <form class="contact-form" action="/api/contact" method="post" novalidate>

              <p class="contact-form__title">échangez avec un expert</p>

              <div class="contact-form__row">

                <label class="contact-field">

                  <span>entreprise</span>

                  <input type="text" name="company" required autocomplete="organization" />

                </label>

                <label class="contact-field">

                  <span>email</span>

                  <input type="email" name="email" required autocomplete="email" />

                </label>

              </div>

              <label class="contact-field">

                <span>téléphone</span>

                <input type="tel" name="phone" autocomplete="tel" />

              </label>

              <label class="contact-field">

                <span>votre besoin</span>

                <textarea name="message" rows="4" placeholder="machines, fontaine, café…"></textarea>

              </label>

              <button type="submit" class="btn btn-primary btn-block">Envoyer ma demande</button>

            </form>

          </div>

        </div>

      </section>
